[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authorized-game-downloader"
version = "0.1.0"
description = "Web search and sequential multipart downloader for authorized game archives"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PySide6>=6.7",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.10"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
authorized-game-downloader = "game_downloader.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_downloader"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/game_downloader/download/manager.py" = ["ASYNC230", "ASYNC240"]
"src/game_downloader/archive/extractor.py" = ["ASYNC230", "ASYNC240"]
"src/game_downloader/storage/fuckingfast_download.py" = ["ASYNC230", "ASYNC240"]
